name: dose_wise
description: DoseWise — a private, offline medication schedule & adherence tracker.
version: 1.4.0+7
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.70.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  path_provider: ^2.1.3
  share_plus: ^11.0.0
  file_picker: ^10.1.9

  # Doctor-visit report export
  pdf: ^3.12.0

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  # Direct platform dep — injection constructs FlutterSecureStorage
  flutter_secure_storage: ^9.2.2

  # App lock — biometric / device-credential prompt, constructed in main()
  local_auth: ^2.3.0

  # Core packages
  core_crypto:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_crypto
      ref: e356ccaddc45fcdfcabe19831dd222c380fda167
  core_storage:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_storage
      ref: e356ccaddc45fcdfcabe19831dd222c380fda167
  core_theme:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_theme
      ref: e356ccaddc45fcdfcabe19831dd222c380fda167
  core_ui:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_ui
      ref: e356ccaddc45fcdfcabe19831dd222c380fda167
  core_backup:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_backup
      ref: e356ccaddc45fcdfcabe19831dd222c380fda167
  core_lock:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_lock
      ref: e356ccaddc45fcdfcabe19831dd222c380fda167
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
