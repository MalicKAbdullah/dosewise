name: dose_wise
description: DoseWise — a private, offline medication schedule & adherence tracker.
version: 1.10.0+14
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  package_info_plus: ^8.0.0

  # Navigation
  go_router: ^14.2.0

  # Charts
  fl_chart: ^0.70.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.0
  path_provider: ^2.1.3
  share_plus: ^11.0.0
  file_picker: ^10.1.9

  # Doctor-visit report export
  pdf: ^3.12.0

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  # Direct platform dep — injection constructs FlutterSecureStorage
  flutter_secure_storage: ^9.2.2

  # App lock — biometric / device-credential prompt, constructed in main()
  local_auth: ^2.3.0

  # Core packages
  core_crypto:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_crypto
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_storage:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_storage
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_theme:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_theme
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_ui:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_ui
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_backup:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_backup
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_lock:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_lock
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
  core_update:
    git:
      url: https://github.com/MalicKAbdullah/secure-suite-core.git
      path: core_update
      ref: 3e90d1221ef1e4010748944c83459df13d18c205
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.6
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#08805F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F6F7F9"
  color_dark: "#0A0C10"
  image: assets/brand/splash-tile.png
  branding: assets/brand/offlyne-endorsement.png
  branding_dark: assets/brand/offlyne-endorsement-white.png
  android_12:
    image: assets/icon/icon_foreground.png
    icon_background_color: "#08805F"
    icon_background_color_dark: "#08805F"
    color: "#F6F7F9"
    color_dark: "#0A0C10"
    branding: assets/brand/offlyne-endorsement.png
    branding_dark: assets/brand/offlyne-endorsement-white.png
